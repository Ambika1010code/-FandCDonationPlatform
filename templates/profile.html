{% extends 'base.html' %}{% block title %}Profile | F&C{% endblock %}{% block content %}<section class="form-area"><div class="form-card" style="max-width:800px;margin:auto"><h2>My Profile</h2><form method="POST"><div class="row g-3"><div class="col-md-6"><label>Name</label><input name="name" class="form-control" value="{{ user.name if user else '' }}" required></div><div class="col-md-6"><label>Email</label><input type="email" name="email" class="form-control" value="{{ user.email if user else '' }}" required></div><div class="col-md-6"><label>Phone</label><input name="phone" class="form-control" value="{{ user.phone if user else '' }}"></div><div class="col-md-6"><label>Role</label><input class="form-control" value="{{ user.role if user else '' }}" disabled></div><div class="col-12"><label>Address</label><input name="address" class="form-control" value="{{ user.address if user else '' }}"></div></div><button class="btn btn-primary mt-4">Save Profile</button></form></div></section>{% endblock %}
