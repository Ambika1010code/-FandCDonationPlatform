{% extends 'base.html' %}
{% block title %}My Profile | F&C{% endblock %}
{% block content %}
<section class="dashboard-page">
<div class="container py-5">
    <div class="form-card profile-card">
        <div class="profile-top">
            <div class="profile-avatar">{{ user.name[0]|upper }}</div>
            <div><h2>{{ user.name }}</h2><p>{{ user.role|capitalize }} account · {{ user.email }}</p></div>
        </div>
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6"><label>Name</label><input name="name" class="form-control" value="{{ user.name }}" required></div>
                <div class="col-md-6"><label>Email</label><input class="form-control" value="{{ user.email }}" disabled></div>
                <div class="col-md-6"><label>Phone</label><input name="phone" class="form-control" value="{{ user.phone or '' }}"></div>
                <div class="col-md-6"><label>Role</label><input class="form-control" value="{{ user.role|capitalize }}" disabled></div>
                <div class="col-12"><label>Address</label><textarea name="address" class="form-control" rows="3">{{ user.address or '' }}</textarea></div>
                <div class="col-12"><button class="btn btn-primary form-button">Save Profile Changes</button></div>
            </div>
        </form>
    </div>
</div>
</section>
{% endblock %}
