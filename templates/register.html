{% extends 'base.html' %}

{% block title %}Register | F&C{% endblock %}

{% block content %}
<section class="auth-page register-page">

    <div class="auth-heading">
        <span class="auth-logo">♥</span>
        <h1>Create Your Account</h1>
        <p>Join the F&C community today.</p>

        <div class="progress-lines">
            <span></span>
            <span></span>
        </div>
    </div>


    <div class="auth-card register-card">

        <form method="POST" id="registerForm">

            <!-- REGISTRATION FIELDS -->

            <div class="register-fields">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label>Full Name</label>
                        <input
                            name="name"
                            class="form-control"
                            placeholder="Your name"
                            required>
                    </div>


                    <div class="col-md-6">
                        <label>Phone</label>
                        <input
                            name="phone"
                            class="form-control"
                            placeholder="+977 98XXXXXXXX">
                    </div>


                    <div class="col-md-6">
                        <label>Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="you@example.com"
                            required>
                    </div>


                    <div class="col-md-6">
                        <label>Address</label>
                        <input
                            name="address"
                            class="form-control"
                            placeholder="City, District">
                    </div>


                    <div class="col-md-6">
                        <label>Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            minlength="6"
                            required>
                    </div>


                    <div class="col-md-6">
                        <label>Confirm Password</label>
                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            minlength="6"
                            required>
                    </div>

                </div>

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100 form-button mt-4">
                Create Account →
            </button>

        </form>


        <p class="auth-bottom">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>

    </div>

</section>

{% endblock %}
