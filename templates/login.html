{% extends 'base.html' %}
{% block title %}Login | F&C{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-heading"><span class="auth-logo">♥</span><h1>Welcome Back</h1><p>Sign in with the email and password you registered with.</p></div>
  <div class="auth-card">
    <form method="POST" novalidate>
      <label for="email">Email Address</label>
      <input id="email" type="email" name="email" class="form-control" placeholder="you@example.com" required>
      <label for="password" class="mt-3">Password</label>
      <div class="password-wrap"><input id="password" type="password" name="password" class="form-control" placeholder="Enter your password" required><button type="button" class="password-btn" onclick="togglePassword('password')">👁</button></div>
      <div class="login-options mt-3"><label class="check-label"><input type="checkbox" name="remember"> Remember me</label><span class="text-secondary">Your account type is detected automatically.</span></div>
      <button class="btn btn-primary w-100 form-button mt-3">Sign In</button>
    </form>
    <p class="auth-bottom">Don't have an account? <a href="{{ url_for('register') }}">Register free</a></p>
  </div>
</section>
{% endblock %}
